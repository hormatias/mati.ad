  <script>
    (() => {
      const canvas = document.getElementById('shader-background');
      const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
      if (!gl) return;
      const vertex = `attribute vec2 position; void main() { gl_Position = vec4(position, 0.0, 1.0); }`;
      const fragment = `
        #ifdef GL_FRAGMENT_PRECISION_HIGH
        precision highp float;
        #else
        precision mediump float;
        #endif
        uniform vec2 resolution; uniform float time;
        void main() { vec2 uv = (gl_FragCoord.xy * 2.0 - resolution.xy) / min(resolution.x, resolution.y);
          float t = time * 0.05; float lineWidth = 0.002; vec3 color = vec3(0.0);
          for (int j = 0; j < 3; j++) { for (int i = 0; i < 5; i++) {
            color[j] += lineWidth * float(i * i) / abs(fract(t - 0.01 * float(j) + float(i) * 0.01) * 5.0 - length(uv) + mod(uv.x + uv.y, 0.2));
          }} gl_FragColor = vec4(color[0], color[1], color[2], 1.0); }`;
      const compile = (type, source) => { const shader = gl.createShader(type); gl.shaderSource(shader, source); gl.compileShader(shader); return shader; };
      const program = gl.createProgram(); gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex)); gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment)); gl.linkProgram(program);
      const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      const position = gl.getAttribLocation(program, 'position'), resolution = gl.getUniformLocation(program, 'resolution'), time = gl.getUniformLocation(program, 'time');
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const resize = () => { const dpr = Math.min(devicePixelRatio || 1, 900 / Math.max(innerWidth, innerHeight)); canvas.width = Math.max(1, Math.round(innerWidth * dpr)); canvas.height = Math.max(1, Math.round(innerHeight * dpr)); gl.viewport(0, 0, canvas.width, canvas.height); };
      addEventListener('resize', resize); resize(); gl.useProgram(program); gl.enableVertexAttribArray(position); gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
      let shaderTime = 1;
      let previousTime = null;
      let animationFrame;
      const draw = (now) => {
        if (document.hidden) return;
        // The reference advances 0.05 per frame at 60 fps: 3 units per second.
        // RAF timestamps are milliseconds. Wrap at the shader's 20-unit period
        // to preserve floating-point precision during long visits.
        if (!reduced && previousTime !== null) {
          shaderTime = (shaderTime + Math.min(now - previousTime, 100) * 0.003) % 20;
        }
        previousTime = now;
        gl.uniform2f(resolution, canvas.width, canvas.height);
        gl.uniform1f(time, shaderTime);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        if (!reduced) animationFrame = requestAnimationFrame(draw);
      };
      document.addEventListener('visibilitychange', () => {
        cancelAnimationFrame(animationFrame);
        previousTime = null;
        if (!document.hidden) draw(performance.now());
      });
      if (reduced) addEventListener('resize', () => draw(performance.now()));
      draw(performance.now());
    })();
